<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing URL Checker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b8f9a;
    --accent: #4f8cff;
    --good: #2fbf71;
    --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 16px;
  }
  .wrap { max-width: 560px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: none;
  }
  #result.legit { border-color: var(--good); background: rgba(47,191,113,0.08); }
  #result.phish { border-color: var(--bad); background: rgba(224,90,90,0.08); }
  #result.err { border-color: var(--bad); background: rgba(224,90,90,0.08); }
  #result .label { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #result .conf { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  #result .msg { font-size: 13px; color: var(--muted); }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre {
    font-size: 11px;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 8px;
  }
  .settings { margin-top: 32px; font-size: 12px; color: var(--muted); }
  .settings input {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0d0f13;
    color: var(--text);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phishing URL Checker</h1>
  <div class="sub">Paste a URL — features are computed server-side and passed straight to the Random Forest model.</div>

  <form id="urlForm">
    <input type="text" id="urlInput" placeholder="https://example.com" required>
    <button type="submit" id="submitBtn">Check</button>
  </form>

  <div id="result"></div>

  <div class="settings">
    <label for="apiUrl">API endpoint</label>
    <input type="text" id="apiUrl" value="https://phishing-website-detector-osbl.onrender.com/predict">
  </div>
</div>

<script>
const form = document.getElementById("urlForm");
const resultBox = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const url = document.getElementById("urlInput").value.trim();
  const apiUrl = document.getElementById("apiUrl").value.trim();
  if (!url || !apiUrl) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Checking...";

  try {
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (!res.ok) {
      showResult("err", "Server error", data.error || JSON.stringify(data), null);
    } else {
      const cls = data.Prediction === "Legitimate" ? "legit" : "phish";
      let conf = "";
      if (data.Probability) {
        const pct = (Math.max(...data.Probability) * 100).toFixed(1);
        conf = `${pct}% confidence`;
      }
      showResult(cls, data.Prediction, conf, data.features_used);
    }
  } catch (err) {
    showResult("err", "Request failed", `Could not reach the API. ${err.message}`, null);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Check";
  }
});

function showResult(cls, label, sub, featuresUsed) {
  resultBox.className = cls;
  resultBox.style.display = "block";
  let html = `<div class="label">${label}</div>`;
  if (sub) html += `<div class="conf">${sub}</div>`;
  if (!featuresUsed) html += `<div class="msg">${sub && cls === "err" ? "" : ""}</div>`;
  if (featuresUsed) {
    html += `<details><summary>Computed feature values</summary><pre>${JSON.stringify(featuresUsed, null, 2)}</pre></details>`;
  }
  resultBox.innerHTML = html;
}
</script>
</body>
</html>
